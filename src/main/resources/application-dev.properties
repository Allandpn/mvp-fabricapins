# Dados de conexao com o banco PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fabricapins
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.mode=always

# Dados configuracao JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Configuracao do servidor
server.error.include-message=always

# Configuracao do Swagger
springdoc.api-docs.path=/api-fabricapins
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configuracao do Render
server.port=${PORT:8080}

# Configuração de CORS
app.cors.allowed-origins = http://localhost:3000,http://localhost:5173,http://localhost:8080